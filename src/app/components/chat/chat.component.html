
<div class="chat-container">
  <!-- Header -->
  <div class="chat-header">
    <h2>🏦 Assistant Réconciliation Bancaire</h2>
    <div class="connection-status">
      <span [ngClass]="{'connected': isConnected, 'disconnected': !isConnected}">
        {{ isConnected ? '🟢 Connecté' : '🔴 Déconnecté' }}
      </span>
      <button (click)="testConnection()" class="btn-test">🧪 Test</button>
    </div>
  </div>
  
  <!-- Messages -->
  <div class="chat-messages" #messagesContainer>
    <div *ngFor="let msg of messages" 
         [ngClass]="{'user-message': msg.isUser, 'bot-message': !msg.isUser}"
         class="message">
      
      <div class="message-content">
        <div class="message-text" [innerHTML]="formatMessage(msg.message)"></div>
        <div class="message-info">
          <span class="timestamp">{{ msg.timestamp | date:'HH:mm' }}</span>
          <span *ngIf="msg.intent && !msg.isUser" class="intent-info">
            {{ msg.intent }} ({{ (msg.confidence! * 100) | number:'1.0-1' }}%)
          </span>
        </div>
      </div>
    </div>
    
    <!-- Indicateur de frappe -->
    <div *ngIf="isLoading" class="bot-message">
      <div class="message-content">
        <div class="typing-indicator">
          <span></span><span></span><span></span>
        </div>
        <div class="typing-text">Assistant analyse votre demande...</div>
      </div>
    </div>
  </div>
  
  <!-- Suggestions rapides -->
  <div class="quick-suggestions" *ngIf="!isLoading">
    <div class="suggestions-label">💡 Suggestions rapides :</div>
    <div class="suggestions-buttons">
      <button *ngFor="let suggestion of quickSuggestions" 
              (click)="sendQuickMessage(suggestion)"
              class="suggestion-btn">
        {{ suggestion }}
      </button>
    </div>
  </div>
  
  <!-- Zone de saisie -->
  <div class="chat-input">
    <div class="input-group">
      <textarea 
        [(ngModel)]="currentMessage"
        (keypress)="onKeyPress($event)"
        placeholder="Tapez votre question sur la réconciliation bancaire..."
        rows="2"
        class="form-control"
        [disabled]="isLoading || !isConnected">
      </textarea>
      <button 
        (click)="sendMessage()" 
        [disabled]="!currentMessage.trim() || isLoading || !isConnected"
        class="btn btn-primary">
        <span *ngIf="!isLoading">📤</span>
        <span *ngIf="isLoading" class="spinner">⏳</span>
      </button>
    </div>
  </div>
</div>
