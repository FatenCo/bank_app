<h1 mat-dialog-title>{{ data.title }}</h1>
<div mat-dialog-content>
  <p>{{ data.message }}</p>
</div>
<div mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false" *ngIf="data.cancelText">
    {{ data.cancelText }}
  </button>
  <button mat-flat-button color="primary" [mat-dialog-close]="true" *ngIf="data.confirmText && data.showConfirm">
    {{ data.confirmText }}
  </button>
</div>
