

spring.application.name=lettrage

# Datasource MySQL pour JPA / Hibernate

spring.datasource.url=jdbc:mysql://localhost:3306/projetdb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Quartz en mémoire (pas de tables QRTZ_* créées)

# On utilise le job-store en mémoire
spring.quartz.job-store-type=memory

# Empêche l?initialisation automatique du schéma Quartz
spring.quartz.jdbc.initialize-schema=never


# JWT / Sécurité (exemple)

app.secret-key=mySuperSecretKeyForJWTGeneration
app.expiration-time=86400000


# Multipart (upload de fichiers)

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# directories à surveiller
watch.accounts.dir=D:/projet pfe/LETTRAGE COMPTABLE/accountsDirectory
watch.stmts.dir   =D:/projet pfe/LETTRAGE COMPTABLE/stmtDirectory
watch.archive-accounts-dir=D:/projet pfe/LETTRAGE COMPTABLE/archiveAccounts
watch.archive-stmts-dir=D:/projet pfe/LETTRAGE COMPTABLE/archiveStmt
# logs
logging.level.root=INFO
logging.level.com.bank.app=DEBUG
logging.file.name=logs/lettrage.log
logging.file.path=target
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ... [vos propriétés existantes] ...

# Optimisations Hibernate
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100

# Configuration de la réconciliation
reconciliation.exact-match=false

# Paramètres de performance
reconciliation.batch-size=500

# Tolérance pour la réconciliation (en unités monétaires)
reconciliation.tolerance=100.00

spring.main.allow-bean-definition-overriding=true


# Configuration Ollama optimisée
ollama.url=http://localhost:11434
ollama.model=llama3.2:3b
ollama.timeout=25000
ollama.temperature=0.3
ollama.max-tokens=150

# Configuration Spring Boot
server.connection-timeout=30s
spring.mvc.async.request-timeout=30s

# Logging pour debug
logging.level.com.bank.app.lettrage.service.OllamaClientService=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG
